<style>
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --surface-2:#F2EFE7; --ink:#0A0A0A; --muted:#55524C;
  --line:rgba(10,10,10,.12); --gold:#9A7718; --gold-soft:rgba(154,119,24,.12);
  --turq:#0B877D; --turq-soft:rgba(11,135,125,.10);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0E0D0B; --surface-2:#17150F; --ink:#F2EDE1; --muted:#A8A294;
    --line:rgba(242,237,225,.13); --gold:#D1B055; --gold-soft:rgba(209,176,85,.13);
    --turq:#40D0C1; --turq-soft:rgba(64,208,193,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0D0B; --surface-2:#17150F; --ink:#F2EDE1; --muted:#A8A294;
  --line:rgba(242,237,225,.13); --gold:#D1B055; --gold-soft:rgba(209,176,85,.13);
  --turq:#40D0C1; --turq-soft:rgba(64,208,193,.12);
}
.band{
  --bg:#000000; --surface:#0E0D0B; --surface-2:#17150F; --ink:#F2EDE1; --muted:#A8A294;
  --line:rgba(242,237,225,.14); --gold:#D1B055; --gold-soft:rgba(209,176,85,.14);
  --turq:#40D0C1; --turq-soft:rgba(64,208,193,.12);
  background:var(--bg); color:var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--turq);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;font-weight:700}
h1{font-size:clamp(2.5rem,6.4vw,4.75rem);line-height:1.02;font-weight:750}
h2{font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.06}
h3{font-size:1.3rem;line-height:1.2;font-weight:650}
p{margin:0}
.lead{color:var(--muted);font-size:1.15rem;max-width:58ch}
.icon{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:10px;font-weight:600;text-decoration:none;font-size:1rem;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:background-color .2s,border-color .2s}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:color-mix(in srgb,var(--gold) 86%,#fff)}
.btn-line{border-color:var(--line);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--gold)}

.site-header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:1.3rem;letter-spacing:-.02em}
.brand svg{width:34px;height:34px}
.brand b{font-weight:800}
.brand span span{font-weight:500;color:var(--muted)}
.nav-links{display:none;gap:28px;font-size:.95rem}
.nav-links a{text-decoration:none;color:var(--muted)}
.nav-links a:hover{color:var(--ink)}
.nav .btn{padding:10px 16px;font-size:.92rem;white-space:nowrap}
@media (max-width:400px){.brand{font-size:1.1rem}.brand svg{width:28px;height:28px}.nav .btn{padding:9px 12px}}
@media (min-width:900px){.nav-links{display:flex}}

/* Hero */
.hero{padding:56px 0 72px}
.hero-grid{display:grid;gap:48px;align-items:center}
.hero h1{max-width:12ch}
.hero .lead{margin-top:22px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.meridian-note{margin-top:36px;display:flex;gap:14px;align-items:flex-start;color:var(--muted);font-size:.95rem;max-width:46ch}
.meridian-note svg{width:30px;height:30px;flex:none;margin-top:2px}
.meridian{display:none}
.hero-phone{display:flex;flex-direction:column;align-items:center;gap:14px}
.palette-note{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);text-align:center}
.sw{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
@media (min-width:900px){
  .hero{padding:72px 0 96px}
  .hero-grid{grid-template-columns:1.15fr 90px .85fr;gap:24px}
  .meridian{display:block;position:relative;align-self:stretch;min-height:600px}
  .meridian::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(var(--gold) 0 80%,transparent)}
  .pin{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.25;background:var(--bg);padding:6px 0}
  .pin i{width:12px;height:12px;border-radius:50%;background:var(--gold);display:block}
  .pin.accra i{background:var(--turq);box-shadow:0 0 0 6px var(--turq-soft)}
  .pin strong{color:var(--ink);font-weight:600;font-size:.85rem}
  .pin.london{top:12%}
  .pin.accra{top:62%}
  .meridian-note svg{display:none}
}

/* Live app device frames */
.handset{position:relative;width:min(340px,100%);height:700px;border-radius:46px;background:#050505;padding:10px;
  box-shadow:0 0 0 1px rgba(209,176,85,.5),0 40px 80px -30px rgba(0,0,0,.8)}
.handset iframe{display:block;width:100%;height:100%;border:0;border-radius:36px;background:#FAFBFC}
@media (max-width:420px){.handset{height:640px;border-radius:40px}.handset iframe{border-radius:31px}}
.browser{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.browser-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#E9EAEE}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#C9CCD3;display:block}
.url{flex:1;min-width:0;background:#fff;border-radius:7px;padding:4px 10px;font-size:12px;color:#5B616B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--body)}
.viewport{user-select:none;position:relative;width:100%;aspect-ratio:1200/900;overflow:hidden;background:#FFF9F4}
.viewport iframe{position:absolute;left:0;top:0;width:1200px;height:900px;border:0;transform-origin:0 0;transform:scale(var(--s,1))}
.web-only{display:none}
.phone-only{display:flex;justify-content:center}
@media (min-width:860px){.web-only{display:block}.phone-only{display:none}}

/* Sections */
.section{padding:72px 0}
@media (min-width:900px){.section{padding:104px 0}}
.section-head{max-width:720px;margin-bottom:44px}
.section-head .lead{margin-top:16px}

.services{display:grid;border-top:1px solid var(--line)}
.svc{padding:32px 0;border-bottom:1px solid var(--line)}
.svc .icon{width:34px;height:34px;color:var(--gold);stroke-width:1.5}
.svc h3{margin-top:18px}
.svc p{margin-top:10px;color:var(--muted)}
.ticks{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px;font-size:.95rem}
.ticks li{position:relative;padding-left:22px}
.ticks li::before{content:"";position:absolute;left:0;top:.72em;width:12px;height:2px;background:var(--turq)}
@media (min-width:900px){
  .services{grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .svc{padding:40px 32px;border-bottom:0}
  .svc+.svc{border-left:1px solid var(--line)}
  .svc:first-child{padding-left:0}
  .svc:last-child{padding-right:0}
}

.products{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.prod{background:var(--surface);padding:30px 24px}
.prod-top{display:flex;align-items:center;gap:14px}
.prod-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--turq);border:1px solid color-mix(in srgb,var(--turq) 45%,transparent);background:var(--turq-soft)}
.prod p{margin-top:14px;color:var(--muted);max-width:44ch}
.prod.fraud{background:var(--surface-2)}
.prod.fraud .prod-icon{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:var(--gold-soft)}
@media (min-width:760px){.products{grid-template-columns:1fr 1fr}.prod{padding:40px}}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:32px}
.bank-picker{display:flex;flex-wrap:wrap;gap:8px}
.bank-chip{display:inline-grid;place-items:center;padding:5px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;transition:border-color .2s,background-color .2s}
.bank-chip .sw{width:30px;height:30px}
.bank-chip:hover{border-color:var(--gold)}
.bank-chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 1px var(--gold)}
.rotation{display:flex;align-items:center;gap:14px;flex:1;min-width:240px}
.rot-bar{flex:1;max-width:360px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.rot-bar span{display:block;height:100%;width:0;background:var(--gold)}
.rot-bar.run span{animation:fill 4.5s linear forwards}
@keyframes fill{to{width:100%}}
.toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.toggle .icon{width:16px;height:16px}
.toggle:hover{border-color:var(--gold)}
.disclaimer{margin-top:28px;font-size:.85rem;color:var(--muted);max-width:70ch}

.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:step}
.step{counter-increment:step;display:grid;grid-template-columns:56px 1fr;gap:4px 16px;padding:26px 0;border-top:1px solid var(--line)}
.step::before{content:counter(step);grid-row:span 2;font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;color:var(--gold)}
.step p{color:var(--muted);margin-top:6px}
@media (min-width:900px){
  .steps{grid-template-columns:repeat(4,1fr);gap:32px}
  .step{grid-template-columns:1fr;padding-top:28px;border-top:2px solid var(--gold)}
  .step::before{grid-row:auto;margin-bottom:14px}
}

.reach{display:grid;gap:14px}
.place{padding:28px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.place h3{display:flex;align-items:center;gap:10px}
.place h3 i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:block}
.place.gh h3 i{background:var(--turq)}
.place.world h3 i{background:transparent;border:2px solid var(--gold)}
.place p{margin-top:10px;color:var(--muted)}
@media (min-width:900px){.reach{grid-template-columns:repeat(3,1fr);gap:20px}}

.contact-grid{display:grid;gap:40px}
.form{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.field{display:grid;gap:6px}
.field label{font-size:.9rem;font-weight:600}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--turq);outline-offset:1px;border-color:transparent}
.two{display:grid;gap:16px}
.form-status{font-size:.95rem;color:var(--turq);min-height:1.5em}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}.form{padding:32px}}
@media (min-width:900px){.contact-grid{grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}}

.footer{padding:44px 0;border-top:1px solid var(--line)}
.footer-grid{display:grid;gap:22px}
.footer small{color:var(--muted);display:block;max-width:70ch;line-height:1.5}
.footer nav{display:flex;flex-wrap:wrap;gap:18px;font-size:.92rem}
.footer nav a{text-decoration:none;color:var(--muted)}
.footer nav a:hover{color:var(--ink)}
@media (min-width:900px){.footer-grid{grid-template-columns:1fr auto;align-items:center}}


/* Lean layout */
.head{margin-bottom:36px}
.tiles{display:grid;gap:14px}
.tile{padding:30px 26px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.tile-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.tile-icon .icon{width:32px;height:32px;stroke-width:1.5}
.tile h3{margin-top:22px}
.tile p{margin-top:6px;color:var(--muted)}
@media (min-width:760px){.tiles.three{grid-template-columns:repeat(3,1fr);gap:20px}}
.prod h3{margin-top:20px}
.prod .prod-icon{width:56px;height:56px}
.prod .prod-icon .icon{width:28px;height:28px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tags span{font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step{display:flex!important;align-items:center;gap:14px}
.step .icon{width:26px;height:26px;color:var(--turq);flex:none}
.step::before{grid-row:auto!important;font-size:1.6rem!important}
@media (min-width:900px){.step{flex-direction:column;align-items:flex-start;gap:12px}}
.flagdot{display:block;width:18px;height:18px;border-radius:50%;background:var(--gold);margin-bottom:18px}
.flagdot.gh{background:var(--turq);box-shadow:0 0 0 6px var(--turq-soft)}
.flagdot.world{background:transparent;border:2px solid var(--gold)}
.place p{margin-top:4px}
.phone-only .lead{text-align:center}
.contact-grid h2{align-self:start}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .bank-chip,.btn{transition:none}
  .rot-bar.run span{animation:none;width:100%}
}
</style>
<style>
/* ---- protection ---- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,svg,a{-webkit-user-drag:none}
.handset::after,.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='140'><text x='10' y='90' transform='rotate(-24 110 70)' font-family='Arial,sans-serif' font-size='15' font-weight='700' fill='rgba(20,20,20,0.10)'>pokztechnologies.com</text></svg>");background-repeat:repeat}
.handset::after{inset:10px;border-radius:36px}
.shielded .handset iframe,.shielded .viewport iframe{filter:blur(22px) saturate(.6);transition:filter .15s}
@media print{
  body *{display:none!important}
  body::before{content:"Printing is disabled. Visit www.pokztechnologies.com";display:block;font:16px sans-serif;padding:40px}
}
</style>
</head>
